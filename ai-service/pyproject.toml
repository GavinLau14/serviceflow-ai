[project]
name = "serviceflow-ai"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "langgraph>=1,<2", "fastembed>=0.7,<1", "qdrant-client>=1.15,<2", "httpx>=0.28,<1", "pydantic-settings>=2.10,<3"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["real: real FastEmbed and external Qdrant smoke (explicit opt-in)"]
