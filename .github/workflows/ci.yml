name: ServiceFlow verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: serviceflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Public CI fixtures, not production credentials.
      SERVICEFLOW_DB_PASSWORD: ci-test-only-password
      SERVICEFLOW_DEMO_PASSWORD: Test-Only-Password-123!
      SERVICEFLOW_JDBC_URL: jdbc:mysql://127.0.0.1:13319/serviceflow_test?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      SERVICEFLOW_REDIS_PORT: 16390
      SERVICEFLOW_DEMO_ENABLED: true
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: serviceflow_test
          MYSQL_USER: serviceflow
          MYSQL_PASSWORD: ci-test-only-password
          MYSQL_ROOT_PASSWORD: ci-root-only-password
        ports: ['13319:3306']
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7.4-alpine
        ports: ['16390:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: mvn -B -f backend/pom.xml verify
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: npx --prefix frontend playwright install --with-deps chromium
      - name: Browser business workflow
        shell: bash
        run: |
          java -jar backend/target/serviceflow-api-0.1.0.jar > api.log 2>&1 &
          npm --prefix frontend run dev > web.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:18081/actuator/health && curl -fsS http://127.0.0.1:15173/ >/dev/null; then break; fi
            sleep 1
          done
          npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            backend/target/surefire-reports/
            frontend/test-results/
            api.log
            web.log

  ai-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements.lock
      - run: pip install -r ai-service/requirements.lock
      - name: Offline acceptance harness contracts (no model calls)
        run: python -m unittest discover -s scripts/tests -v
      - run: cd ai-service && python -m pytest -m 'not real' -q

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and start isolated demo stack
        run: ./scripts/stack-up.sh
      - name: Authenticated full business smoke (no LLM, no model download)
        run: python3 scripts/smoke-stack.py --output stack-smoke.json
      - name: AI outage keeps human workflow available
        run: |
          docker compose stop ai-service
          python3 scripts/smoke-stack.py --expect-ai-error --output stack-outage-smoke.json
          docker compose --profile stack up -d --wait --wait-timeout 120
      - name: Restart preserves business data
        run: |
          docker compose --profile stack restart api web
          docker compose --profile stack up -d --wait --wait-timeout 120
          python3 scripts/smoke-stack.py --verify-previous stack-smoke.json --output stack-restart-smoke.json
      - name: Collect logs
        if: always()
        run: docker compose --profile stack logs --no-color > stack.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-evidence
          path: |
            stack-smoke.json
            stack-restart-smoke.json
            stack-outage-smoke.json
            stack.log
